# Integration continue de l'interface web.
# A chaque envoi qui touche web/, GitHub rejoue sur une machine neuve
# les verifications que l'on fait a la main : licences, failles, tests, compilation.
name: Interface web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

# Le robot lit le depot, il n'a aucun droit d'ecriture.
permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dependances, exactement celles du verrou
        run: npm ci

      - name: Verifier le formatage
        run: npm run format:verifier

      - name: Verifier le code (ESLint)
        run: npm run lint

      - name: Verifier les licences
        run: npm run licences

      # Bloquant : les paquets qui partent en production (next, react, marked...).
      - name: Verifier les failles connues, en production
        run: npm audit --omit=dev

      # Informatif : les outils de developpement (vite, vitest) ne sont jamais servis.
      # Le 18/11/2026, picomatch (tire par vite et vitest) a une faille ReDoS sans
      # version corrigee publiee : bloquer ici arreterait toute la CI sans rien proteger.
      - name: Signaler les failles des outils de developpement
        run: npm audit || echo "::warning::npm audit signale des failles dans les outils de developpement (voir ci-dessus)"

      - name: Lancer les tests
        run: npm test

      - name: Compiler
        run: npm run build
